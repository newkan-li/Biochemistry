<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#fffdfb"/>
  <text x="450" y="40" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#12324d">蛋白质变性与复性（AI示意图）</text>
  <g font-family="sans-serif" font-size="16" fill="#1f3b57">
    <circle cx="260" cy="220" r="95" fill="#e8f1fb" stroke="#2c6da8" stroke-width="3"/>
    <circle cx="260" cy="220" r="45" fill="#f4d6a6" stroke="#b57a2a" stroke-width="2"/>
    <text x="260" y="225" text-anchor="middle" font-size="17" fill="#6b4314">天然构象</text>
    <text x="260" y="340" text-anchor="middle">有活性、紧密</text>
    <path d="M380 220 h140" stroke="#c0392b" stroke-width="4" marker-end="url(#ar)"/>
    <text x="450" y="205" text-anchor="middle" font-size="15" fill="#8e2b20">热/极端pH/尿素/SDS</text>
    <path d="M540 160 q20 30 -10 60 q40 20 5 55 q35 25 0 55" fill="none" stroke="#c0392b" stroke-width="5"/>
    <text x="600" y="235" font-size="17" fill="#8e2b20">变性：次级键破坏</text>
    <text x="600" y="262" font-size="15" fill="#8e2b20">一级结构通常保留</text>
    <text x="600" y="289" font-size="15" fill="#8e2b20">活性丧失、溶解度下降</text>
    <path d="M700 330 h120" stroke="#2c6da8" stroke-width="4" marker-end="url(#ar)"/>
    <text x="760" y="315" text-anchor="middle" font-size="15" fill="#1f3b57">去除变性剂</text>
    <text x="760" y="370" text-anchor="middle" font-size="16" fill="#1f3b57">可复性（Anfinsen）</text>
    <text x="760" y="397" text-anchor="middle" font-size="14" fill="#1f3b57">序列决定结构</text>
    <text x="90" y="455" font-size="15">变性剂：尿素/盐酸胍（氢键）、SDS（疏水）、热、极端pH、有机溶剂、重金属</text>
  </g>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
</svg>
