    <text x="610" y="290" font-size="15">二级结构预测：Chou-Fasman/GOR</text>
    <text x="610" y="320" font-size="15">三级结构：同源建模/Threading</text>
    <text x="610" y="350" font-size="15">AlphaFold；实验验证：CD/NMR/晶体/电镜</text>
    <text x="90" y="480" font-size="15">Anfinsen：变性核糖核酸酶去除变性剂后可复性→序列决定结构</text>
