<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f8fcff"/>
  <text x="450" y="38" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#12324d">二级结构四种基本类型（AI示意图）</text>
  <g font-family="sans-serif">
    <rect x="35" y="70" width="195" height="380" rx="14" fill="#eef6ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="132" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3b57">α螺旋</text>
    <path d="M70 180 q15 -50 30 0 q15 50 30 0 q15 -50 30 0 q15 50 30 0" fill="none" stroke="#c0392b" stroke-width="7"/>
    <text x="132" y="245" text-anchor="middle" font-size="14">3.6残基/圈</text>
    <text x="132" y="270" text-anchor="middle" font-size="14">螺距0.54 nm</text>
    <text x="132" y="295" text-anchor="middle" font-size="14">i→i+4氢键</text>
    <text x="132" y="340" text-anchor="middle" font-size="13">右手螺旋</text>
    <text x="132" y="365" text-anchor="middle" font-size="13">侧链朝外</text>
    <rect x="250" y="70" width="195" height="380" rx="14" fill="#eef8ee" stroke="#5aa35a" stroke-width="2"/>
    <text x="347" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3b57">β折叠</text>
    <g stroke="#2c6da8" stroke-width="7" fill="none">
      <path d="M280 180 h100 l15 -25 h30"/>
      <path d="M280 220 h100 l15 25 h30"/>
      <path d="M280 260 h100 l15 -25 h30"/>
    </g>
    <text x="347" y="310" text-anchor="middle" font-size="14">链间氢键</text>
    <text x="347" y="335" text-anchor="middle" font-size="14">轴心距0.35 nm</text>
    <text x="347" y="360" text-anchor="middle" font-size="13">平行/反平行</text>
    <text x="347" y="385" text-anchor="middle" font-size="13">侧链交替</text>
    <rect x="465" y="70" width="195" height="380" rx="14" fill="#fdf0e8" stroke="#c77b3a" stroke-width="2"/>
    <text x="562" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3b57">β转角</text>
    <path d="M500 200 h60 q30 0 30 30 q0 30 -30 30 h-60" fill="none" stroke="#b55a1f" stroke-width="7"/>
    <text x="562" y="300" text-anchor="middle" font-size="14">4个残基</text>
    <text x="562" y="325" text-anchor="middle" font-size="14">Gly/Pro常见</text>
    <text x="562" y="350" text-anchor="middle" font-size="13">使链回折</text>
    <rect x="680" y="70" width="185" height="380" rx="14" fill="#f5f0fb" stroke="#8e6bb5" stroke-width="2"/>
    <text x="772" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3b57">无规卷曲</text>
    <path d="M715 200 q20 -40 40 0 q20 40 40 0 q20 -40 40 0 q20 40 40 0" fill="none" stroke="#7d5aa8" stroke-width="7"/>
    <text x="772" y="300" text-anchor="middle" font-size="14">无规则重复</text>
    <text x="772" y="325" text-anchor="middle" font-size="14">但仍有确定构象</text>
    <text x="772" y="350" text-anchor="middle" font-size="13">常位于表面/连接区</text>
    <text x="450" y="495" text-anchor="middle" font-size="15" fill="#1f3b57">二级结构由主链氢键稳定；侧链决定稳定性和取向</text>
  </g>
</svg>
