<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f8fbff"/>
  <text x="450" y="40" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#12324d">蛋白质折叠与结构预测（AI示意图）</text>
  <g font-family="sans-serif" font-size="15" fill="#1f3b57">
    <path d="M150 100 q150 20 250 160 q70 100 100 210 h-500 q40 -120 150 -210 q100 -100 0 -160z" fill="#e8f1fb" stroke="#2c6da8" stroke-width="2"/>
    <text x="450" y="125" text-anchor="middle" font-size="16">未折叠/多种构象</text>
    <text x="450" y="300" text-anchor="middle" font-size="16">折叠中间态</text>
    <text x="450" y="430" text-anchor="middle" font-size="16">天然态（低能量）</text>
    <path d="M230 150 q80 60 100 120 q20 60 60 100" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="610" y="170" font-size="15" fill="#8e2b20">折叠漏斗：多路径、能量下降</text>
