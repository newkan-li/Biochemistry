<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#fbfdff"/>
  <text x="450" y="40" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#12324d">蛋白质结构层次（AI示意图）</text>
  <g font-family="sans-serif" font-size="15" fill="#1f3b57">
    <text x="90" y="95" font-size="18" font-weight="bold">一级</text>
    <path d="M60 125 h150" stroke="#2c6da8" stroke-width="5"/>
    <g fill="#2c6da8"><circle cx="60" cy="125" r="7"/><circle cx="90" cy="125" r="7"/><circle cx="120" cy="125" r="7"/><circle cx="150" cy="125" r="7"/><circle cx="180" cy="125" r="7"/><circle cx="210" cy="125" r="7"/></g>
    <text x="60" y="160">氨基酸序列</text>
    <path d="M240 125 h55" stroke="#888" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="330" y="95" font-size="18" font-weight="bold">二级</text>
    <path d="M300 150 q15 -55 30 0 q15 55 30 0 q15 -55 30 0 q15 55 30 0" fill="none" stroke="#b55a1f" stroke-width="6"/>
    <text x="300" y="180">α螺旋/β折叠</text>
    <path d="M450 150 h55" stroke="#888" stroke-width="3"/>
    <text x="540" y="95" font-size="18" font-weight="bold">三级</text>
    <circle cx="590" cy="155" r="55" fill="#e8f1fb" stroke="#2c6da8" stroke-width="3"/>
    <circle cx="590" cy="155" r="25" fill="#f4d6a6" stroke="#b57a2a" stroke-width="2"/>
    <text x="540" y="235">一条链三维折叠</text>
    <path d="M675 155 h55" stroke="#888" stroke-width="3"/>
    <text x="760" y="95" font-size="18" font-weight="bold">四级</text>
    <g fill="#dceaf8" stroke="#2c6da8" stroke-width="2">
      <circle cx="750" cy="130" r="24"/><circle cx="805" cy="130" r="24"/><circle cx="750" cy="185" r="24"/><circle cx="805" cy="185" r="24"/>
    </g>
    <text x="720" y="235">多亚基组装</text>
    <text x="90" y="330" font-size="16">一级：肽键/二硫键；二级：主链氢键；三级：疏水/离子/氢键；四级：亚基非共价缔合</text>
    <text x="90" y="365" font-size="16">四级结构=亚基种类、数目、空间排布；Hb为α₂β₂四聚体</text>
    <text x="90" y="400" font-size="16">对称性：C4、D2等；同种/异种缔合；别构/协同的结构基础</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
</svg>
